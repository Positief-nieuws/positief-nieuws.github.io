name: Nieuwsbriefcontrole
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**/*.html', '*.html', '**/*.py', '*.js', '.github/workflows/newsletter-health.yml']
  pull_request:
    paths: ['**/*.html', '*.html', '**/*.py', '*.js', '.github/workflows/newsletter-health.yml']
  workflow_run:
    workflows: ['pages-build-deployment']
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: newsletter-health-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Controlelogica testen
        run: python -m unittest discover -s tests -p 'test_newsletter_monitor.py'
      - name: Alle lokale inschrijfpunten controleren
        run: python scripts/check_newsletter.py --local --output newsletter-test-results/local
      - name: Live controle zonder inschrijving
        id: live
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        env:
          SIMPLE_ANALYTICS_API_KEY: ${{ secrets.SIMPLE_ANALYTICS_API_KEY }}
        run: python scripts/check_newsletter.py --output newsletter-test-results/live
      - name: Bewaar gedateerd rapport (ook bij fouten)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nieuwsbriefcontrole-${{ github.run_id }}
          path: newsletter-test-results/
          retention-days: 90
          if-no-files-found: error
      - name: Meld storing via één GitHub-issue; sluit na geslaagde live hertest
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          CHECK_FAILED: ${{ job.status == 'failure' }}
          LIVE_OK: ${{ steps.live.outcome == 'success' }}
        with:
          script: |
            const title = '[Nieuwsbriefcontrole] Technische storing onderzoeken';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100
            });
            const incident = issues.find(i => !i.pull_request && i.title === title);
            if (process.env.CHECK_FAILED === 'true' && !incident) {
              await github.rest.issues.create({...context.repo, title,
                body: `Een technische nieuwsbriefcontrole is mislukt. Onderzoek het rapport en test de aanmelding handmatig.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nEen groene technische controle bewijst geen mailbezorging of bevestigde abonnee.`});
            } else if (process.env.LIVE_OK === 'true' && process.env.CHECK_FAILED !== 'true' && incident) {
              await github.rest.issues.update({...context.repo, issue_number: incident.number,
                state: 'closed', state_reason: 'completed'});
            }
