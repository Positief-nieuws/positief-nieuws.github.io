name: Build en controleer 2 november previewbranch
on:
  push:
    branches:
      - preview/2026-11-02
    paths:
      - nieuws.json
      - .github/workflows/preview-build-2026-11-02.yml
      - redactie/2026-11-02-publicatiecheck.md
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/2026-11-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Basistests
        run: |
          python build_editions.py --validate-current
          python -m unittest discover -s tests
      - name: Maak archiefkopie uitsluitend voor deze previewbuild
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          news=Path('nieuws.json').read_text(encoding='utf-8')
          data=json.loads(news)
          assert data['meta']['edition_date']=='2026-11-02'
          target=Path('edities/2026-11-02.json')
          assert not target.exists(), 'Deze editie is al gearchiveerd'
          target.write_text(news,encoding='utf-8')
          PY
      - name: Site en Pixabay-afbeeldingen bouwen
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python build_editions.py
      - name: Controleer werkelijk opgeslagen afbeeldingen en artikelpagina's
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          n=json.loads(Path('nieuws.json').read_text())
          cache=json.loads(Path('data/pixabay-images.json').read_text())
          errors=[]
          for section in ('nl','int'):
              for a in n[section]:
                  slug=a['article_slug']
                  key='2026-11-02/'+slug
                  x=cache.get(key,{})
                  path=Path(str(x.get('image_path','')).lstrip('/'))
                  article=Path('artikelen/2026-11-02')/slug/'index.html'
                  if not path.is_file():errors.append('Ontbrekende afbeelding: '+slug)
                  if not article.is_file():errors.append('Ontbrekende artikelpagina: '+slug)
          if errors:raise SystemExit('\n'.join(errors))
          print('12 afbeeldingen en 12 artikelpagina’s aanwezig')
          PY
      - name: Commit previewresultaat, niet naar main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bouw 2 november artikelen en Pixabaybeelden uitsluitend op previewbranch"
          git pull --rebase origin preview/2026-11-02
          git push origin HEAD:preview/2026-11-02
