name: Editiecontrole en onderhoud

on:
  push:
    branches:
      - main
    paths:
      - "nieuws.json"
  pull_request:
    branches: [main]
    paths:
      - "nieuws.json"
      - ".github/workflows/archive-edition.yml"
      - "editorial_check.py"
      - "publish_edition.py"
  workflow_dispatch:
    inputs:
      branding_only:
        description: "Alleen favicon en sitenaam bijwerken op bestaande pagina’s"
        type: boolean
        default: false

      articles_only:
        description: "Alleen artikelpagina’s bijwerken"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: positief-nieuws-build
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || (!inputs.branding_only && !inputs.articles_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Goedgekeurde editie en bijbehorende publicatiebestanden controleren
        run: |
          python editorial_check.py --website
          python publish_edition.py --check-files

  archive:
    if: github.event_name == 'workflow_dispatch' && (inputs.branding_only || inputs.articles_only)
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Favicon en sitenaam bijwerken
        if: ${{ inputs.branding_only }}
        run: python build_editions.py --refresh-branding

      - name: Artikelpagina’s bijwerken
        if: ${{ inputs.articles_only }}
        run: python build_editions.py --refresh-articles

      - name: Gebouwde site committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # De build maakt permanente editiepagina's, /onderwerpen/,
          # dynamische onderwerp-pagina's op rootniveau en sitemap.xml.
          git add -A

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
            exit 0
          fi

          git commit -m "Bewaar nieuwseditie en bouw onderwerpen"
          git pull --rebase origin main
          git push
