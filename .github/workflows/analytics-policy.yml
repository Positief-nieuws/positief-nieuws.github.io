name: Analytics exclusions and visitor funnel
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node tests/test_analytics_policy.js
      - run: node tests/test_newsletter_analytics.js
      - run: node tests/test_social_sharing.js
      - run: python -m unittest discover -s tests -p 'test_analytics_policy.py'
