name: Maak Buttondown concept

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Gepubliceerde editie ophalen
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Maak conceptnieuwsbrief
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python buttondown_draft.py
