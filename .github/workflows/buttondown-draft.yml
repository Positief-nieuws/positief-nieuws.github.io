name: Kit API-controle bestaand proefconcept
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-draft:
    if: github.ref == 'refs/heads/kit-api-controle'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Lees proefconcept, afzender en status via Kit v4
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_SENDER_EMAIL: ${{ vars.KIT_SENDER_EMAIL }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ["KIT_API_KEY"]
          sender = os.environ["KIT_SENDER_EMAIL"]
          assert key and sender, "GitHub-secret of afzendervariable ontbreekt"
          url = "https://api.kit.com/v4/broadcasts/27238320"
          request = urllib.request.Request(url, headers={"X-Kit-Api-Key": key, "Accept": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  draft = json.load(response)["broadcast"]
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Kit API HTTP {error.code}") from None
          assert draft.get("status") == "draft"
          assert draft.get("send_at") is None
          assert draft.get("public") is False
          assert draft.get("email_address") == sender
          assert draft.get("subject", "").startswith("[PROEF]")
          assert "Igor fietst" in draft.get("content", "")
          print("Kit v4: proefconcept gevonden als oningeplande privé-draft. Afzender en inhoud bevestigd.")
          PY
