name: Maak Buttondown concept

on:
  workflow_run:
    workflows:
      - "Bewaar editie"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-draft:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen na succesvolle site-build
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Maak conceptnieuwsbrief
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python buttondown_draft.py
