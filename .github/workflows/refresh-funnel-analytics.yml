name: Activeer nieuwsbriefmeting op alle bestaande pagina's
on:
  push:
    branches:
      - main
    paths:
      - "edition-analytics.js"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: positief-nieuws-build
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update analyticsversie op bestaande pagina's
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = 0
          for path in Path('.').rglob('*.html'):
              if any(part.startswith('.') for part in path.parts):
                  continue
              old = path.read_text(encoding='utf-8')
              new = old.replace('/edition-analytics.js?v=1', '/edition-analytics.js?v=2')
              if new != old:
                  path.write_text(new, encoding='utf-8')
                  pages += 1
          print('Pagina’s bijgewerkt:', pages)
          assert 'edition-analytics.js?v=2' in Path('index.html').read_text(encoding='utf-8')
          assert 'edition-analytics.js?v=2' in Path('nieuwsbrief/index.html').read_text(encoding='utf-8')
          PY
      - name: Publiceer bijgewerkte pagina's
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Activeer nieuwsbrief-funnelmeting op bestaande pagina's"
          git pull --rebase origin main
          git push
