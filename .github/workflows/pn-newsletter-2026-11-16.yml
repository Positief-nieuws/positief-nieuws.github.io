name: Nieuwsbrief 16 november alleen na gecontroleerde livegang
on:
  push:
    branches: [main]
    paths:
      - 'redactie/2026-11-16.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pn-newsletter-2026-11-16-once
  cancel-in-progress: false
jobs:
  send-after-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Controleer publicatie, 12 artikelen, rechtenbewijs en bestaande nieuwsbrief
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request, urllib.parse, urllib.error
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import editorial_check
          import buttondown_draft as bd

          EDITION="2026-11-16"
          SITE="https://positief-nieuws.nl"
          API="https://api.buttondown.com/v1/emails"
          api_key=os.environ.get("BUTTONDOWN_API_KEY","")
          if not api_key: raise SystemExit("STOP: BUTTONDOWN_API_KEY ontbreekt.")
          data,nl,international,headlines=bd.load_news()
          if bd.raw_edition_date(data)!=EDITION: raise SystemExit("STOP: verkeerde hoofdeditie.")
          dossier_path=Path("redactie")/f"{EDITION}.json"
          if not dossier_path.is_file(): raise SystemExit("STOP: bewijsdossier ontbreekt.")
          dossier=json.loads(dossier_path.read_text())
          report=editorial_check.check(data,dossier,require_selection=False)
          if not report['ready']: raise SystemExit("STOP: "+str(report['errors']))
          if dossier.get('approved') is not True or not dossier.get('approved_by'):
              raise SystemExit("STOP: expliciete eigenaarstoestemming ontbreekt.")
          if Path("edities",f"{EDITION}.json").read_bytes()!=Path("nieuws.json").read_bytes():
              raise SystemExit("STOP: archief en homepage hebben verschillende editiebestanden.")
          if len(nl)!=6 or len(international)!=6 or len(headlines)!=3:
              raise SystemExit("STOP: verkeerde aantallen verhalen.")
          expected_urls=[f"{SITE}/",f"{SITE}/edities/{EDITION}/"]+[
              f"{SITE}/artikelen/{EDITION}/{a['article_slug']}/" for a in nl+international]
          assert len(set(expected_urls))==14
          def live_fetch(url,attempt):
              separator='&' if '?' in url else '?'
              bust=url+separator+'pn_internal=1&pn_release_check='+str(attempt)
              req=urllib.request.Request(bust,headers={'User-Agent':'PositiefNieuws-ReleaseControle/1.0'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                  if resp.status!=200: raise RuntimeError(f"HTTP {resp.status}: {url}")
                  text=resp.read().decode('utf-8','replace')
                  if not text or '<html' not in text.lower(): raise RuntimeError('Geen HTML: '+url)
                  if EDITION not in text: raise RuntimeError('Editiedatum ontbreekt: '+url)
                  return text
          last_error=''
          for attempt in range(1,37):
              try:
                  pages=[live_fetch(url,attempt) for url in expected_urls]
                  if nl[0]['article_slug'] not in pages[0]:
                      raise RuntimeError('Nieuwe openingstitel of link ontbreekt op homepage')
                  if 'personal-note-title' in pages[0]:
                      raise RuntimeError('Onverwachte persoonlijke noot op homepage')
                  if sum(1 for p in pages[2:] if 'rel="canonical"' in p)!=12:
                      raise RuntimeError('Canonical ontbreekt op artikelpagina')
                  print('LIVE OK: homepage + editie + alle 12 artikelpagina\'s, 14/14.')
                  break
              except Exception as exc:
                  last_error=str(exc)
                  print(f"Livecontrole {attempt}/36 niet gereed: {last_error}",flush=True)
                  if attempt==36: raise SystemExit('STOP, geen nieuwsbrief: '+last_error)
                  time.sleep(10)

          def api_request(method,url,payload=None):
              body=None if payload is None else json.dumps(payload).encode('utf-8')
              req=urllib.request.Request(url,data=body,method=method,headers={
                 'Authorization':'Token '+api_key,'Accept':'application/json',
                 'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  raw=resp.read()
                  return json.loads(raw) if raw else {}
          subject=bd.build_subject(data)
          canonical=bd.edition_url(data)
          matches=[];seen=set();page=API
          for _ in range(50):
              if not page or page in seen: break
              seen.add(page)
              listing=api_request('GET',page)
              if not isinstance(listing,dict) or not isinstance(listing.get('results'),list):
                  raise SystemExit("STOP: Buttondown-respons niet herkenbaar.")
              for email in listing['results']:
                  if email.get('subject')==subject or email.get('canonical_url')==canonical:
                      matches.append(email)
              next_page=listing.get('next')
              page=urllib.parse.urljoin(API,next_page) if next_page else ''
          else: raise SystemExit('STOP: te veel Buttondown-pagina’s, dubbelcontrole onvolledig.')
          if page and page in seen: raise SystemExit('STOP: Buttondown-paginering herhaalt zich.')
          if len(matches)>1: raise SystemExit(f'STOP: {len(matches)} bestaande editiemails, handmatige check nodig.')
          if matches:
              email=matches[0]
              email_id=email['id']
              status=email.get('status')
              if status in {'about_to_send','in_flight','sent','partially_sent','throttled','scheduled','resending'}:
                  print('Geen tweede verzending: bestaande e-mail',email_id,'heeft status',status)
                  sys.exit(0)
              if status!='draft':
                  raise SystemExit('STOP: onverwachte bestaande Buttondown-status: '+str(status))
              print('Bestaand concept gevonden:',email_id)
          else:
              body=bd.build_body(data,nl,international,headlines)
              email=bd.create_draft(api_key,subject,body,data,bd.build_preheader(data,nl))
              email_id=email['id']
              if email.get('status')!='draft':
                  raise SystemExit('STOP: nieuw concept is geen draft')
              print('Nieuw concept aangemaakt:',email_id)
          # Sending happens only after all 14 live pages and full editorial checks.
          updated=api_request('PATCH',f"{API}/{urllib.parse.quote(str(email_id))}",{'status':'about_to_send'})
          print('Buttondown-status:',updated.get('status','onbekend'))
          if updated.get('status') not in {'about_to_send','in_flight','sent'}:
              raise SystemExit('STOP: Buttondown bevestigde de verzending niet.')
          print('Nieuwsbrief voor '+EDITION+' in verzendwachtrij geplaatst.')
          PY
