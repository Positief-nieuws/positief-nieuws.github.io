name: Dagelijkse Goed nieuws-editie

on:
  workflow_dispatch:
  schedule:
    # Primaire run: maandag, woensdag en vrijdag om 06:37 Nederlandse tijd
    - cron: '37 6 * * 1,3,5'
      timezone: 'Europe/Amsterdam'

    # Back-up run: 15 minuten later. Deze doet niets als de kandidaten
    # vandaag al succesvol zijn gegenereerd.
    - cron: '52 6 * * 1,3,5'
      timezone: 'Europe/Amsterdam'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Controleren of kandidaten vandaag al zijn gemaakt
        id: freshness
        if: github.event_name == 'schedule'
        shell: python
        run: |
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          path = Path("kandidaten.json")
          already_fresh = False

          if path.exists():
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  generated_at = data.get("meta", {}).get("generated_at")
                  if generated_at:
                      generated = datetime.fromisoformat(
                          generated_at.replace("Z", "+00:00")
                      ).astimezone(ZoneInfo("Europe/Amsterdam"))
                      today = datetime.now(ZoneInfo("Europe/Amsterdam")).date()
                      already_fresh = generated.date() == today
              except Exception as exc:
                  print(f"Freshness-check kon bestand niet lezen: {exc}")

          import os\n          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"already_fresh={'true' if already_fresh else 'false'}\n")

          print(f"Kandidaten vandaag al vers: {already_fresh}")

      - name: Kandidaten verzamelen
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.already_fresh != 'true'
        run: python auto_news.py

      - name: Publiceer kandidaten.json indien gewijzigd
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.already_fresh != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kandidaten.json

          if git diff --cached --quiet; then
            echo "Geen wijziging in kandidaten.json"
            exit 0
          fi

          git commit -m "Automatische Goed nieuws-kandidaten"
          git pull --rebase origin main
          git push
