name: Dagelijkse Goed nieuws-editie

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Kandidaten verzamelen
        run: python auto_news.py

      - name: Publiceer kandidaten.json indien gewijzigd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kandidaten.json

          if git diff --cached --quiet; then
            echo "Geen wijziging in kandidaten.json"
            exit 0
          fi

          git commit -m "Automatische Goed nieuws-kandidaten"
          git pull --rebase origin main
          git push
