name: Werk stylesheet-versie bij op bestaande pagina's

on:
  push:
    branches:
      - main
    paths:
      - "build_editions.py"
      - "scripts/refresh_related_articles.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: positief-nieuws-build
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tests voor gerelateerde artikelen
        run: python -m unittest discover -s tests -p 'test_related_content.py'
      - name: Herstel Lees ook op bestaande artikelpagina's
        run: python -m scripts.refresh_related_articles
      - name: Nieuwe stylesheet-versie op bestaande pagina's zetten
        shell: bash
        run: |
          python - <<'PY'
          from build_editions import SITE_THEME_HREF, refresh_site_theme_links

          count = refresh_site_theme_links()
          print(f"CSS {SITE_THEME_HREF} bijgewerkt of hersteld op {count} HTML-pagina's")
          PY

      - name: Controleer gedeelde wintervormgeving
        run: python -m unittest discover -s tests -p 'test_winter_season.py'

      - name: Gewijzigde pagina's publiceren
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Geen pagina's aangepast"
            exit 0
          fi
          git commit -m "Ververs gedeelde stylesheet op bestaande pagina's"
          git pull --rebase origin main
          git push
