name: Nieuwsbriefverbeteringen toepassen
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: positief-nieuws-build
  cancel-in-progress: false
jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Alleen nieuwsbriefplaatsingen bijwerken
        run: python newsletter_conversion.py
      - name: Nieuwsbriefwijzigingen bewaren
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '**/index.html' index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Pas nieuwsbriefplaatsingen toe op bestaande pagina’s'
            git push
          fi
